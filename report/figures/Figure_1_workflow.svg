   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(13.011429 514.945469)">Network weights unchanged. Both calibrations use development supervision.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(13.011429 526.143281)">Schematic of completed experiments; report preparation reads saved results only.</text>
