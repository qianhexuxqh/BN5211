   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.011429" y="26.07" transform="rotate(-0 13.011429 26.07)">Development: fit global parameters using target-domain ground truth</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(69.337121 103.716406)">trans_t1_a</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(43.530089 117.471875)">61 RGB + GT frames</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(37.176964 130.949219)">80,952,223 valid pixels</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(258.897634 103.994531)">Frozen pretrained DAV2</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(269.407009 117.471875)">Metric Indoor Small</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(249.728884 130.949219)">Cached original predictions</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(498.625446 103.994531)">Development GT + predictions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(505.928571 117.471875)">Global scale: median ratio s</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(496.962946 130.949219)">Log-affine: log-space OLS (a, b)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(521.516071 226.135703)">Development GT only</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(516.726228 239.613047)">Constant median depth</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(800.050826 135.723359)">Freeze all parameters</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(793.64067 149.200703)">Median = 17.25948 mm</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(814.189888 162.678047)">s = 0.03821440</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(783.892232 176.155391)">a = -26.36792, b = 4.79152</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="203.722286" y="103.005" transform="rotate(-0 203.722286 103.005)">RGB</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.011429" y="307.05" transform="rotate(-0 13.011429 307.05)">Test: apply fixed methods; ground truth is used only for evaluation</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(69.226964 381.490469)">trans_t2_b</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54.463683 395.245937)">103 RGB frames</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(40.880871 408.723281)">One continuous video</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(271.547634 381.629531)">Same frozen DAV2</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(258.816384 395.106875)">Cached test predictions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(265.873415 408.584219)">No per-frame scaling</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(535.423103 376.563359)">Four predictions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(510.337165 390.040703)">Constant median baseline</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(512.173884 403.518047)">Original DAV2 (zero-shot)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(515.438728 416.995391)">Global scale / Log-affine</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(796.197701 376.563359)">Pixel-pooled evaluation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(795.331295 390.040703)">AbsRel / RMSE (mm) / δ</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(792.982857 403.518047)">136,655,314 valid pixels</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(803.014888 416.995391)">0 &lt; raw GT &lt; 65535</text>
   </g>
   <g id="text_13">
